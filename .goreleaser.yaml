# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: hkcli

builds:
  - id: hkcli
    main: ./cmd/hkcli
    binary: hkcli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/vinaycodeaxe/hkcli/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: hkcli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so releases/latest/download/<name> links always work.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  disable: true

release:
  github:
    owner: vinaycodeaxe
    name: hkcli
  name_template: "hkcli {{ .Tag }}"
