[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hikecli"
dynamic = ["version"]
description = "Unofficial Hike Messenger CLI: link as a web device, keep a searchable local copy of your chats, and send messages from the terminal, scripts and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinay Chaudhary" }]
keywords = ["hike", "hike messenger", "cli", "chat", "messaging", "sqlite", "openclaw", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.6",
    "segno>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7", "websockets>=12"]
docs = ["markdown>=3.5"]

[project.urls]
Homepage = "https://vinaycodeaxe.github.io/hikecli/"
Documentation = "https://vinaycodeaxe.github.io/hikecli/"
Source = "https://github.com/vinaycodeaxe/hikecli"
Issues = "https://github.com/vinaycodeaxe/hikecli/issues"
Changelog = "https://github.com/vinaycodeaxe/hikecli/blob/main/CHANGELOG.md"

[project.scripts]
hikecli = "hikecli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hikecli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
