name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check tag, version and changelog
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version '$version' in internal/version/version.go"
            exit 1
          fi
          python scripts/release_notes.py "$version" > /dev/null

      - name: Test
        run: |
          go vet ./...
          go test ./...
          go build -o dist/ ./cmd/hkcli
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests

  goreleaser:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Release notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and publish the GitHub release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clawhub:
    name: Publish OpenClaw skill
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/clawhub.yml
    with:
      # Dry run unless the repository variable CLAWHUB_PUBLISH is "true" (needs the CLAWHUB_TOKEN secret).
      dry_run: ${{ vars.CLAWHUB_PUBLISH != 'true' }}
      changelog: "hkcli ${{ github.ref_name }}"
    secrets:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
